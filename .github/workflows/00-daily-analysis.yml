name: 每日股票分析

on:
  schedule:
    - cron: '0 10 * * 1-5'     # 周一到周五，北京时间 18:00
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - market-only
          - stocks-only
      force_run:
        description: '强制运行'
        required: false
        default: false
        type: boolean

concurrency:
  group: stock-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: 随机延迟
        run: sleep $((RANDOM % 60))
      
      - name: 检出代码
        uses: actions/checkout@v5
      
      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: 创建目录
        run: mkdir -p data logs reports
      
      - name: 执行分析
        env:
          # AI
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

          # 数据源
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}

          # ======================
          # 邮件配置（我帮你加好了）
          # ======================
          ENABLE_MAIL: true
          ENABLE_FEISHU: false
          EMAIL_SENDER: "chenzhenyu1314@vip.qq.com"
          EMAIL_PASSWORD: "dhvqxxtigwavbaid"
          EMAIL_RECEIVERS: "chenzhenyu1314@vip.qq.com"
          SMTP_HOST: "smtp.qq.com"
          SMTP_PORT: "465"

          # 自选股
          STOCK_LIST: ${{ secrets.STOCK_LIST || '600519' }}


        run: |
          MODE="${{ github.event.inputs.mode || 'full' }}"
          FORCE_RUN_ARG=""
          if [ "${{ github.event.inputs.force_run }}" = "true" ]; then
            FORCE_RUN_ARG="--force-run"
          fi

          if [ "$MODE" = "market-only" ]; then
            python main.py --market-review $FORCE_RUN_ARG
          elif [ "$MODE" = "stocks-only" ]; then
            python main.py --no-market-review $FORCE_RUN_ARG
          else
            python main.py $FORCE_RUN_ARG
          fi
      
      - name: 上传报告
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: analysis-reports-${{ github.run_number }}
          path: |
            reports/
            logs/
          retention-days: 30
